openapi: 3.0.3
info:
  title: LaraforgeX Enterprise API Core
  description: Headless Laravel 13 Intelligent Core API Engine for Students, Educators, and Admins.
  version: 1.0.0
servers:
  - url: http://localhost/api/v1
    description: Local Laragon Environment
paths:
  /auth/login:
    post:
      summary: Traditional Password Login
      description: Authenticates user credentials, registers login metrics, and issues a Bearer access token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@laraforgex.com
                password:
                  type: string
                  format: password
                  example: SecurePassword123!
                remember:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Successful Authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged in successfully.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|zR4FhK8s9xPqT2vW5mN7jY3dL6aB1cE9
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid Credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account Suspended/Inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Log Out Session
      description: Revokes the currently active bearer token.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged Out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out successfully.

  /auth/magic-link:
    post:
      summary: Request Magic Login Link
      description: Generates a secure, temporary hashed access URL and returns it (or dispatches via notification channel).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: teacher@laraforgex.com
      responses:
        '200':
          description: Magic Link Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Magic login link generated.
                  data:
                    type: object
                    properties:
                      link:
                        type: string
                        example: http://localhost/api/v1/auth/magic-login?token=abc123xyz456...

  /auth/magic-login:
    get:
      summary: Authenticate via Magic Link
      description: Validates the token query string parameter, registers user login data, and logs in.
      tags:
        - Authentication
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            example: abc123xyz456...
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Authenticated successfully via magic link.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 2|tM8kPqT2vW5mN7jY3dL6aB1cE9zR4FhK
                      user:
                        $ref: '#/components/schemas/User'

  /auth/2fa/enable:
    post:
      summary: Initiate Two-Factor Authentication
      description: Generates a secret TOTP token and maps registration parameters.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 2FA Initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Two-factor authentication initiated. Scan the QR code to proceed.
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                        example: KJSW23MNS76AX29S
                      qr_code_url:
                        type: string
                        example: otpauth://totp/LaraforgeX:admin@laraforgex.com?secret=KJSW23MNS76AX29S&issuer=LaraforgeX

  /auth/2fa/verify:
    post:
      summary: Confirm Two-Factor Setup
      description: Asserts a user-supplied 6-digit OTP code against the secret to activate 2FA and generates recovery keys.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "482931"
      responses:
        '200':
          description: 2FA Verified and Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Two-factor authentication verified and enabled.
                  data:
                    type: object
                    properties:
                      recovery_codes:
                        type: array
                        items:
                          type: string
                        example:
                          - "abcde-12345"
                          - "fghij-67890"

  /users:
    get:
      summary: List Users with Search and Filters
      description: Retrieves a paginated list of users. Supports filtering by status, roles, and name/email matching.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            example: John
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended]
            example: active
        - name: role
          in: query
          schema:
            type: string
            example: educator
        - name: per_page
          in: query
          schema:
            type: integer
            example: 15
      responses:
        '200':
          description: Dynamic user list returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create New User
      description: Creates a user, hashes the password, and maps role permissions.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john.doe@laraforgex.com
                password:
                  type: string
                  example: PasswordX99!
                status:
                  type: string
                  enum: [active, inactive, suspended]
                  example: active
                roles:
                  type: array
                  items:
                    type: string
                  example: ["educator"]
      responses:
        '201':
          description: User Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User created successfully.
                  data:
                    $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: View User Details
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 98fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9
      responses:
        '200':
          description: User resource returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'

    put:
      summary: Update User
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 98fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe Updated
                email:
                  type: string
                  format: email
                  example: john.doe@laraforgex.com
                status:
                  type: string
                  example: active
                roles:
                  type: array
                  items:
                    type: string
                  example: ["educator"]
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User updated successfully.
                  data:
                    $ref: '#/components/schemas/User'

    delete:
      summary: Soft Delete User
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User soft deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User deleted successfully.

  /users/{id}/suspend:
    post:
      summary: Suspend User Account
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User account suspended successfully.

  /settings:
    get:
      summary: List Platform Settings
      description: Retrieve dynamic key-value settings by category group name (uses Redis repository cache).
      tags:
        - Settings
      security:
        - BearerAuth: []
      parameters:
        - name: group
          in: query
          schema:
            type: string
            example: smtp
      responses:
        '200':
          description: Configuration retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      mail_host:
                        type: string
                        example: smtp.mailtrap.io
                      mail_port:
                        type: string
                        example: "2525"
                      mail_username:
                        type: string
                        example: dev_user
                      mail_password:
                        type: string
                        example: DecryptedSecureSmtpKey

    post:
      summary: Save Settings Configuration
      description: Stores dynamic key-value pairs. Encrypts values marked with is_encrypted using AES-256 keys.
      tags:
        - Settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - settings
              properties:
                settings:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                      - value
                    properties:
                      key:
                        type: string
                        example: mail_password
                      value:
                        type: string
                        example: VerySecretSmtpPassword123!
                      group:
                        type: string
                        example: smtp
                      is_encrypted:
                        type: boolean
                        example: true
      responses:
        '200':
          description: Configurations stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Settings saved successfully.

  /media/presign:
    post:
      summary: Request Cloud Direct Upload Presigned URL
      description: Generates a temporary AWS S3 or Cloudflare R2 presigned PUT url and logs the metadata in pending state.
      tags:
        - Media
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - mime_type
                - size
              properties:
                name:
                  type: string
                  example: course_introduction.mp4
                mime_type:
                  type: string
                  example: video/mp4
                size:
                  type: integer
                  example: 154829302
                folder_id:
                  type: string
                  format: uuid
                  example: 1a8fd9a7-e1ba-4f2e-89a1-cb9e8c4e47a9
      responses:
        '200':
          description: Presigned URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      media:
                        $ref: '#/components/schemas/MediaFile'
                      upload_url:
                        type: string
                        example: https://laraforgex-bucket.s3.us-east-1.amazonaws.com/media/98fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9/2026/07/17/abc.mp4?X-Amz-Signature=...
                      headers:
                        type: object
                        properties:
                          Content-Type:
                            type: string
                            example: video/mp4

  /media/{id}/confirm:
    post:
      summary: Confirm Upload Complete
      description: Verifies that the client uploaded the file to cloud storage and changes media status to active.
      tags:
        - Media
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media active
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Media file upload confirmed.
                  data:
                    $ref: '#/components/schemas/MediaFile'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 98fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@laraforgex.com
        avatar:
          type: string
          nullable: true
          example: https://laraforgex.com/avatars/john.jpg
        status:
          type: string
          example: active
        last_login_at:
          type: string
          format: date-time
          example: 2026-07-17T12:00:00Z
        last_login_ip:
          type: string
          example: 127.0.0.1
        email_verified_at:
          type: string
          format: date-time
          example: 2026-07-17T11:00:00Z
        two_factor_enabled:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: ["educator", "moderator"]
        permissions:
          type: array
          items:
            type: string
          example: ["courses.create", "courses.edit", "users.view"]
        created_at:
          type: string
          format: date-time
          example: 2026-07-17T10:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-07-17T12:00:00Z

    MediaFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 87fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9
        folder_id:
          type: string
          format: uuid
          nullable: true
          example: 1a8fd9a7-e1ba-4f2e-89a1-cb9e8c4e47a9
        name:
          type: string
          example: course_introduction.mp4
        file_name:
          type: string
          example: 87fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9.mp4
        mime_type:
          type: string
          example: video/mp4
        disk:
          type: string
          example: s3
        size:
          type: integer
          example: 154829302
        url:
          type: string
          example: https://laraforgex-bucket.s3.amazonaws.com/media/98fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9/2026/07/17/87fd9a76-e1ba-4f2e-89a1-cb9e8c4e47a9.mp4?AWSAccessKeyId=...
        custom_properties:
          type: object
          properties:
            status:
              type: string
              example: pending_upload
        created_at:
          type: string
          format: date-time
          example: 2026-07-17T12:00:00Z

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 3
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 45

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.
