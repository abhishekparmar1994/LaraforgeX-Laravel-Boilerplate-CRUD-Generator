<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar EPC & Rooftop OS — Project Lifecycle Flowchart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8">

  <!-- Sticky Top Actions Bar -->
  <header class="no-print max-w-6xl mx-auto mb-8 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 sticky top-4 z-50 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-500 border border-amber-500/30 flex items-center justify-center text-lg">
        <i class="fa-solid fa-solar-panel"></i>
      </div>
      <div>
        <h1 class="text-sm md:text-base font-extrabold text-white">Solar EPC Project Lifecycle</h1>
        <p class="text-xs text-slate-400">High-Resolution Vector & Raster Image Exporter</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="downloadAsPng()" id="btn-png" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center gap-2 transition shadow-lg shadow-emerald-600/20 cursor-pointer">
        <i class="fa-solid fa-download"></i> Download PNG
      </button>
      <a href="solar_project_flowchart.svg" download="solar_project_flowchart.svg" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl flex items-center gap-2 transition shadow-lg shadow-indigo-600/20 cursor-pointer">
        <i class="fa-solid fa-file-code"></i> Download SVG
      </a>
      <button onclick="window.print()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl flex items-center gap-2 transition cursor-pointer">
        <i class="fa-solid fa-print"></i> Print
      </button>
    </div>
  </header>

  <!-- Flowchart Container -->
  <main class="max-w-6xl mx-auto space-y-6">
    <div id="svg-container" class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-2 md:p-6 shadow-2xl overflow-x-auto flex justify-center">
      <img id="flowchart-img" src="solar_project_flowchart.svg" alt="Solar Project Lifecycle Flowchart" class="w-full max-w-[1100px] h-auto rounded-2xl shadow-xl" />
    </div>
  </main>

  <canvas id="export-canvas" style="display:none;"></canvas>

  <script>
    async function downloadAsPng() {
      const btn = document.getElementById('btn-png');
      const origText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Rendering PNG...';
      btn.disabled = true;

      try {
        const svgImg = document.getElementById('flowchart-img');
        const img = new Image();
        img.crossOrigin = 'anonymous';

        // Load the SVG into an Image object
        img.onload = () => {
          const canvas = document.getElementById('export-canvas');
          const scale = 2; // High-resolution 2x supersampling
          canvas.width = img.naturalWidth * scale;
          canvas.height = img.naturalHeight * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Download PNG
          const pngUrl = canvas.toDataURL('image/png');
          const downloadLink = document.createElement('a');
          downloadLink.href = pngUrl;
          downloadLink.download = 'solar_project_flowchart.png';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);

          btn.innerHTML = origText;
          btn.disabled = false;
        };

        img.onerror = (e) => {
          alert('Could not render PNG from SVG: ' + e);
          btn.innerHTML = origText;
          btn.disabled = false;
        };

        img.src = 'solar_project_flowchart.svg';
      } catch (err) {
        alert('PNG Export error: ' + err.message);
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
